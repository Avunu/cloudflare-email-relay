version: 2

# Updates land on `main` automatically (see .github/workflows/dependabot-auto-merge.yml);
# release-please remains the gate for cutting a release. Dep bumps use the `fix(deps)` type, so
# each merged bump ships as a patch release.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      github-actions:
        patterns: ["*"]

  # One group, so vitest and @cloudflare/vitest-pool-workers (which pins vitest's major through
  # its peer range) always move together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(deps)
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: vitest
        versions: [">= 4"]
