name: Release

# Release Please maintains a release PR from Conventional Commits on main. When it is merged the
# package is tagged v{version} and published to GitHub Packages; src/version.ts carries an
# `x-release-please-version` marker so the User-Agent the relay sends matches the release.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@avunu"

      - name: Publish @avunu/cloudflare-email-relay
        if: ${{ steps.release.outputs.release_created }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm publish
